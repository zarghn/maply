    <meta charset="UTF-8" />

    <title>Maply — Track your workouts</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="

  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="app-header">
          <img src="img/logo.png" alt="" class="logo-icon" />
        </header>
        <form class="workout-form" id="workoutForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="inputType">choose</label>
              <select id="inputType" name="type" class="form-badge" disabled>
                <option value="running">run</option>
                <option value="cycling">cycle</option>
                <option value="cycling">walk</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="inputDistance">Distance</label>
              <input
                id="inputDistance"
                name="distance"
                class="form-badge"
                type="number"
                inputmode="decimal"
                placeholder="KM"
                step="0.1"
                min="0"
                disabled
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="inputDuration">Duration</label>
              <input
                id="inputDuration"
                name="duration"
                class="form-badge"
                type="number"
                inputmode="numeric"
                placeholder="MIN"
                min="0"
                disabled
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="inputCadence">Cadence</label>
              <input
                id="inputCadence"
                name="cadence"
                class="form-badge badge-wide"
                type="number"
                inputmode="numeric"
                placeholder="STEP/MIN"
                min="0"
                disabled
              />
            </div>
          </div>

          <div class="form-submit-row">
            <button type="submit" class="btn-entry" id="btnEntry" disabled>
              <span>entry</span>
              <img src="img/arrow-entry.png" alt="" class="icon-arrow" />
            </button>
          </div>
        </form>
